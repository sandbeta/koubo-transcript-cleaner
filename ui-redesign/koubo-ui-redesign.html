<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稿纸台 · 口播文字稿整理工具 UI 重设计原型</title>
<style>
/* ==========================================================================
   稿纸台 / Manuscript Desk —— 设计令牌（唯一允许出现色值的地方）
   依据 ui-redesign/DESIGN.md；对比度为 WCAG 相对亮度公式实算值
   ========================================================================== */
:root {
  /* —— primitive：纸与墨 —— */
  --p-paper:   #FFFFFF;
  --p-page:    #F5F4F0;
  --p-panel:   #FBFAF7;
  --p-ink-900: #1A1D21;  /* 15.37:1 on page */
  --p-ink-700: #20242A;  /* 15.59:1 on paper —— 稿纸正文 */
  --p-ink-600: #4A5157;  /*  7.32:1 on page —— UI 次级 */
  --p-ink-500: #5E666D;  /*  5.30:1 on page —— 弱化说明下限 */
  /* —— primitive：动作青 —— */
  --p-teal-900:#115E59;  /*  6.89:1 on page */
  --p-teal-700:#0F766E;  /*  5.47:1 with white —— 主按钮底 */
  --p-teal-600:#0D9488;  /*  4.97:1 on page —— 仅大字/图形 */
  --p-teal-50: #E6F4F1;
  /* —— primitive：判定四色 —— */
  --p-red-700:#B42318; --p-red-800:#97231B; --p-red-50:#FBE9E7;
  --p-org-700:#B45309; --p-org-800:#9A3412; --p-org-50:#FBEBE0;
  --p-grn-700:#15803D; --p-grn-800:#166534; --p-grn-50:#E7F4EC;
  --p-blue-700:#1D4ED8; --p-blue-50:#EAF0FB;
  /* —— primitive：线 —— */
  --p-line:  #DDDAD2;  /* 1.4:1 纯装饰分隔 */
  --p-edge:  #6B7280;  /* 4.83:1 控件边界 */
  --p-edge-soft: #B4B1A8;

  /* —— semantic —— */
  --surface-app: var(--p-page);
  --surface-paper: var(--p-paper);
  --surface-panel: var(--p-panel);
  --surface-select: var(--p-teal-50);
  --surface-hover: #EFEDE6;
  --ink-primary: var(--p-ink-700);
  --ink-ui: var(--p-ink-600);
  --ink-muted: var(--p-ink-500);
  --ink-on-action: #FFFFFF;
  --action: var(--p-teal-700);
  --action-hover: var(--p-teal-900);
  --action-text: var(--p-teal-900);
  --flag-must: var(--p-red-800);
  --flag-mark: var(--p-org-800);
  --keep: var(--p-grn-800);
  --quote: var(--p-blue-700);
  --focus: var(--p-teal-700);
  --edge-field: var(--p-edge);
  --rule: var(--p-line);
  /* 压在饱和底色上的字：亮档白，暗档必须转深（白字压浅青只有 1.5:1） */
  --ink-on-solid: #FFFFFF;

  /* —— 排印 —— */
  --font-ui: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
  --font-body: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "Noto Serif SC", STSong, SimSun, serif;
  --font-num: ui-monospace, "SF Mono", Consolas, "JetBrains Mono", monospace;
  --t-12:12px; --t-13:13px; --t-15:15px; --t-18:18px; --t-22:22px; --t-28:28px; --t-36:36px;

  /* —— 间距（密度 7/10）—— */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;

  /* —— 尺寸 —— */
  --rail-w:232px; --insp-w:384px;
  --target:28px;          /* WCAG 2.2 SC 2.5.8 要求 24 CSS px，这里留到 28 */
  --btn-h:40px;
  --measure:38em;         /* 稿纸行宽：38 个汉字 */

  /* —— 动效 —— */
  --d-fast:120ms; --d-panel:200ms; --e-out:cubic-bezier(.2,.8,.2,1); --e-in:cubic-bezier(.4,0,1,1);

  /* —— 组件层 —— */
  --c-pill-red: var(--p-red-50);   --c-pill-org: var(--p-org-50);
  --c-pill-grn: var(--p-grn-50);   --c-pill-blue: var(--p-blue-50);
  --c-row-hover: var(--surface-hover);
  --c-bar-track: #E4E1D8;
}

/* 夜稿：稿纸比页面更暗，保持「稿纸是与环境反差最大的面」 */
[data-theme="dark"] {
  --p-paper:#0F1315; --p-page:#14181B; --p-panel:#1B2124;
  --p-ink-900:#E7EAE8; --p-ink-700:#DDE2E4; --p-ink-600:#A9B2B8; --p-ink-500:#8C979E;
  --p-teal-900:#5EEAD4; --p-teal-700:#2DD4BF; --p-teal-600:#2DD4BF; --p-teal-50:#123834;
  --p-red-700:#F9A8A0; --p-red-800:#F9A8A0; --p-red-50:#3A1D1B;
  --p-org-700:#F0B28C; --p-org-800:#F0B28C; --p-org-50:#372415;
  --p-grn-700:#7DD3A8; --p-grn-800:#7DD3A8; --p-grn-50:#17301F;
  --p-blue-700:#93B4F5; --p-blue-50:#18233A;
  --p-line:#262C31; --p-edge:#6E787E; --p-edge-soft:#454D53;
  --surface-hover:#222A2F; --surface-select:#123834;
  --ink-on-action:#0F1315; --ink-on-solid:#0F1315; --action-text:#5EEAD4;
  --focus:#5EEAD4; --c-bar-track:#2A3238;
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    --p-paper:#0F1315; --p-page:#14181B; --p-panel:#1B2124;
    --p-ink-900:#E7EAE8; --p-ink-700:#DDE2E4; --p-ink-600:#A9B2B8; --p-ink-500:#8C979E;
    --p-teal-900:#5EEAD4; --p-teal-700:#2DD4BF; --p-teal-600:#2DD4BF; --p-teal-50:#123834;
    --p-red-700:#F9A8A0; --p-red-800:#F9A8A0; --p-red-50:#3A1D1B;
    --p-org-700:#F0B28C; --p-org-800:#F0B28C; --p-org-50:#372415;
    --p-grn-700:#7DD3A8; --p-grn-800:#7DD3A8; --p-grn-50:#17301F;
    --p-blue-700:#93B4F5; --p-blue-50:#18233A;
    --p-line:#262C31; --p-edge:#6E787E; --p-edge-soft:#454D53;
    --surface-hover:#222A2F; --surface-select:#123834;
    --ink-on-action:#0F1315; --ink-on-solid:#0F1315; --action-text:#5EEAD4;
    --focus:#5EEAD4; --c-bar-track:#2A3238;
  }
}

/* ============================ 基础 ============================ */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--surface-app); color: var(--ink-ui);
  font: 400 var(--t-15)/1.6 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3 { margin: 0; font-weight: 700; color: var(--ink-primary); font-family: var(--font-ui); }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; }
.sr-only {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing:-.02em; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.ico { width: 18px; height: 18px; flex: 0 0 auto; }
.ico-sm { width: 15px; height: 15px; flex: 0 0 auto; }

/* ============================ 骨架 ============================ */
.app { display: flex; flex-direction: column; height: 100vh; }

.bar {
  display: flex; align-items: center; gap: var(--s-3);
  height: 56px; padding: 0 var(--s-4); flex: 0 0 auto;
  background: var(--surface-panel); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: var(--s-2); font-weight: 700; color: var(--ink-primary); font-size: var(--t-15); }
.brand .mark { width: 26px; height: 26px; color: var(--action); }
.brand .tag {
  font: 600 var(--t-12)/1 var(--font-num); color: var(--action-text);
  background: var(--surface-select); padding: 4px 6px; border-radius: 4px;
}
.docname {
  display: flex; align-items: center; gap: var(--s-2); min-width: 0; flex: 1 1 auto;
  padding: 0 var(--s-3); height: 34px; border-radius: 6px;
  border: 1px dashed transparent;
}
.docname:hover { border-color: var(--p-edge-soft); }
.docname input {
  background: none; border: 0; color: var(--ink-primary); font-weight: 600;
  font-size: var(--t-15); width: 100%; max-width: 320px;
}
.bar-right { display: flex; align-items: center; gap: var(--s-2); margin-left: auto; }
.stat { color: var(--ink-muted); font-size: var(--t-13); }

.body { display: flex; flex: 1 1 auto; min-height: 0; }

/* —— 左轨：5 步 —— */
.rail {
  flex: 0 0 var(--rail-w); display: flex; flex-direction: column; gap: var(--s-1);
  padding: var(--s-4) var(--s-3); overflow-y: auto;
  background: var(--surface-panel); border-right: 1px solid var(--rule);
}
.rail .lead {
  font: 600 var(--t-12)/1 var(--font-ui); letter-spacing: .12em;
  color: var(--ink-muted); padding: 0 var(--s-2) var(--s-2);
}
.step {
  display: flex; align-items: center; gap: var(--s-3);
  min-height: var(--target); padding: var(--s-2) var(--s-2);
  border: 0; border-radius: 8px; background: none; cursor: pointer;
  text-align: left; color: var(--ink-ui); position: relative;
  transition: background-color var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out);
}
.step:hover { background: var(--c-row-hover); }
.step[aria-current="true"] { background: var(--surface-select); color: var(--action-text); font-weight: 600; }
.step[aria-current="true"]::before {
  content: ""; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--action);
}
.step .no {
  flex: 0 0 22px; height: 22px; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--p-edge-soft);
  font: 600 var(--t-12)/1 var(--font-num); color: var(--ink-muted);
}
.step[aria-current="true"] .no { border-color: var(--action); background: var(--action); color: var(--ink-on-action); }
.step .nm { flex: 1 1 auto; min-width: 0; }
.step .sub { display: block; font-size: var(--t-12); color: var(--ink-muted); font-weight: 400; }
.step .cnt {
  font: 600 var(--t-12)/1 var(--font-num); color: var(--ink-muted);
  background: var(--p-page); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 7px;
}
.step .cnt[data-tone="warn"] { color: var(--flag-mark); background: var(--c-pill-org); border-color: transparent; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--s-1); padding-top: var(--s-4); border-top: 1px solid var(--rule); }

/* —— 中栏：稿纸台 —— */
.desk { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.desk-head {
  display: flex; align-items: baseline; gap: var(--s-3); flex: 0 0 auto;
  padding: var(--s-5) var(--s-6) var(--s-3);
}
.desk-head h2 { font-size: var(--t-22); letter-spacing: -.01em; }
.desk-head .why { margin-left: auto; }
.desk-scroll { flex: 1 1 auto; overflow-y: auto; padding: 0 var(--s-6) var(--s-7); }
.sheet {
  background: var(--surface-paper); border-radius: 10px;
  box-shadow: 0 1px 2px rgba(26,29,33,.06), 0 8px 24px -12px rgba(26,29,33,.18);
  padding: var(--s-6); max-width: 860px;
}
[data-theme="dark"] .sheet, .sheet { }
[data-theme="dark"] .sheet { box-shadow: 0 1px 0 rgba(0,0,0,.4), 0 12px 32px -16px #000; }

/* —— 右栏：检视器 —— */
.inspector {
  flex: 0 0 var(--insp-w); display: flex; flex-direction: column; min-height: 0;
  background: var(--surface-panel); border-left: 1px solid var(--rule);
}
.insp-tabs { display: flex; gap: var(--s-1); padding: var(--s-3) var(--s-3) 0; flex: 0 0 auto; }
.itab {
  border: 0; background: none; cursor: pointer; padding: var(--s-2) var(--s-3);
  min-height: var(--target); border-radius: 8px 8px 0 0; color: var(--ink-muted);
  font-size: var(--t-13); font-weight: 600;
  transition: color var(--d-fast) var(--e-out), background-color var(--d-fast) var(--e-out);
}
.itab:hover { color: var(--ink-primary); background: var(--c-row-hover); }
.itab[aria-selected="true"] { color: var(--action-text); background: var(--surface-select); }
.insp-body { flex: 1 1 auto; overflow-y: auto; padding: var(--s-4); border-top: 1px solid var(--rule); }
.card { border: 1px solid var(--rule); border-radius: 10px; padding: var(--s-4); margin-bottom: var(--s-4); background: var(--surface-paper); }
.card > h3 {
  display: flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-15); margin-bottom: var(--s-3);
}
.card > h3 .n { margin-left: auto; font: 600 var(--t-12)/1 var(--font-num); color: var(--ink-muted); }
.kv { display: flex; justify-content: space-between; gap: var(--s-3); padding: var(--s-2) 0; border-top: 1px solid var(--rule); font-size: var(--t-13); }
.kv:first-of-type { border-top: 0; }
.kv b { color: var(--ink-primary); font-weight: 600; }
.note { font-size: var(--t-13); color: var(--ink-muted); line-height: 1.7; }
.note b { color: var(--ink-ui); font-weight: 600; }
.why-list { margin: 0; padding-left: 1.1em; font-size: var(--t-13); color: var(--ink-ui); line-height: 1.75; }
.why-list li { margin-bottom: var(--s-2); }
.why-list code { font: 500 var(--t-12)/1.6 var(--font-num); color: var(--action-text); }

/* ============================ 控件 ============================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: var(--btn-h); padding: 0 var(--s-4); border-radius: 8px;
  border: 1px solid var(--edge-field); background: var(--surface-paper); color: var(--action-text);
  cursor: pointer; font-weight: 600; font-size: var(--t-15);
  transition: background-color var(--d-fast) var(--e-out), border-color var(--d-fast) var(--e-out), transform var(--d-fast) var(--e-out);
}
.btn:hover { background: var(--surface-select); }
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--action); border-color: var(--action); color: var(--ink-on-action); }
.btn-primary:hover { background: var(--action-hover); border-color: var(--action-hover); color: var(--ink-on-solid); }
.btn-ghost { border-color: transparent; background: none; }
.btn-ghost:hover { background: var(--c-row-hover); }
.btn-sm { min-height: var(--target); padding: 0 var(--s-3); font-size: var(--t-13); border-radius: 6px; }
.btn-danger-quiet { border-color: transparent; background: none; color: var(--ink-muted); }
.btn-danger-quiet:hover { color: var(--p-red-700); background: var(--c-pill-red); }
.icon-btn {
  width: var(--target); height: var(--target); display: grid; place-items: center;
  border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer; color: var(--ink-ui);
  transition: background-color var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out);
}
.icon-btn:hover { background: var(--c-row-hover); color: var(--ink-primary); }
/* 命中的是 label 不是 input：包住的 label 才是可指点区域 */
.seg { display: inline-flex; gap: var(--s-1); background: var(--p-page); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; }
.seg label {
  display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 var(--s-3);
  border-radius: 6px; cursor: pointer; font-size: var(--t-13); color: var(--ink-ui);
  transition: background-color var(--d-fast) var(--e-out), color var(--d-fast) var(--e-out);
}
.seg label:hover { background: var(--c-row-hover); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg input:checked + span { color: var(--action-text); font-weight: 700; }
.seg label:has(input:checked) { background: var(--surface-paper); box-shadow: 0 1px 2px rgba(26,29,33,.12); }
.seg label:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.field {
  width: 100%; min-height: 40px; padding: var(--s-2) var(--s-3); border-radius: 8px;
  border: 1px solid var(--edge-field); background: var(--surface-paper); color: var(--ink-primary);
}
.field::placeholder { color: var(--ink-muted); }
textarea.field { line-height: 1.8; resize: vertical; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 2px 8px;
  border-radius: 999px; font: 600 var(--t-12)/1.4 var(--font-ui);
}
.pill-red  { background: var(--c-pill-red);  color: var(--p-red-800); }
.pill-org  { background: var(--c-pill-org);  color: var(--p-org-800); }
.pill-grn  { background: var(--c-pill-grn);  color: var(--p-grn-800); }
.pill-blue { background: var(--c-pill-blue); color: var(--p-blue-700); }
.pill-mute { background: var(--p-page); color: var(--ink-muted); border: 1px solid var(--rule); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: var(--target);
  padding: 0 var(--s-2) 0 var(--s-3); border-radius: 999px;
  background: var(--surface-paper); border: 1px solid var(--edge-field); color: var(--ink-primary);
  font-size: var(--t-13); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--surface-select); border-color: var(--action); color: var(--action-text); font-weight: 600; }
.chip .x { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-muted); }
.chip .x:hover { background: var(--c-pill-red); color: var(--p-red-800); }

/* ============================ 稿纸：句级 diff ============================ */
.ms { font-family: var(--font-body); font-size: var(--t-18); line-height: 2.0; color: var(--ink-primary); max-width: var(--measure); }
.ms .para-gap { height: var(--s-3); }
.srow {
  display: flex; gap: var(--s-3); align-items: flex-start;
  padding: var(--s-2) var(--s-3); margin: 0 calc(-1 * var(--s-3));
  border-radius: 8px; border-left: 3px solid transparent;
  transition: background-color var(--d-fast) var(--e-out);
}
.srow:hover, .srow:focus-within { background: var(--surface-hover); }
.srow .tc {
  font: 500 var(--t-12)/1.9 var(--font-num); color: var(--ink-muted);
  flex: 0 0 auto; padding-top: .35em; white-space: nowrap;
}
.srow .tx { flex: 1 1 auto; min-width: 0; }
.srow .ops { flex: 0 0 auto; display: flex; gap: var(--s-1); opacity: 0; transition: opacity var(--d-fast) var(--e-out); }
.srow:hover .ops, .srow:focus-within .ops, .srow[data-pinned="true"] .ops { opacity: 1; }

/* 已删：划线 + 色条 + 降透明度（形状与颜色双编码） */
.srow.is-cut { border-left-color: var(--p-org-700); background: var(--c-pill-org); }
.srow.is-cut .tx { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--p-org-700); color: var(--ink-muted); }
/* 放回 */
.srow.is-kept { border-left-color: var(--p-grn-700); }
.srow.is-kept .tx { color: var(--ink-primary); }
/* 只标记 */
.srow.is-mark { border-left-color: var(--p-org-700); background: none; }
.srow.is-mark .tx::before { content: "【待删】"; font-family: var(--font-ui); font-size: .72em; color: var(--p-org-800); vertical-align: .18em; margin-right: .3em; }
/* 客户原话 */
.srow.is-quote .tx { border-left: 2px solid var(--p-blue-700); padding-left: var(--s-3); color: var(--p-blue-700); }
/* 极限词：词级波浪线，不靠颜色单独承载 */
.risk-word {
  text-decoration: underline wavy var(--p-red-700); text-decoration-thickness: 1px;
  text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0;
  font: inherit; color: inherit;
}
.risk-word::after { content: " ⚠"; font-family: var(--font-ui); font-size: .68em; color: var(--p-red-700); vertical-align: .22em; }

/* ============================ 表格（素材库 / 成片） ============================ */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  text-align: left; font: 600 var(--t-12)/1 var(--font-ui); letter-spacing: .06em;
  color: var(--ink-muted); padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--rule);
  white-space: nowrap;
}
.tbl td { padding: var(--s-3); border-bottom: 1px solid var(--rule); vertical-align: top; font-size: var(--t-13); }
.tbl tr { transition: background-color var(--d-fast) var(--e-out); }
.tbl tbody tr:hover { background: var(--surface-hover); }
.tbl .body-cell { font-family: var(--font-body); font-size: var(--t-15); line-height: 1.7; color: var(--ink-primary); max-width: 34em; }
.bar-mini { display: block; width: 68px; height: 6px; border-radius: 3px; background: var(--c-bar-track); overflow: hidden; }
.bar-mini i { display: block; height: 100%; background: var(--p-teal-600); border-radius: 3px; }
.stars { display: inline-flex; gap: 2px; }
.stars button { width: var(--target); height: var(--target); display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--p-edge-soft); border-radius: 4px; }
.stars button:hover { background: var(--c-row-hover); }
.stars button[data-on="true"] { color: var(--p-org-700); }

/* ============================ 其他 ============================ */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--s-3);
  padding: var(--s-7) var(--s-5); text-align: center; color: var(--ink-muted);
  border: 1px dashed var(--p-edge-soft); border-radius: 10px;
}
.empty .glyph { width: 34px; height: 34px; color: var(--p-edge-soft); }
.empty p { margin: 0; max-width: 30em; font-size: var(--t-13); line-height: 1.7; }
.gaps { display: grid; gap: var(--s-2); }
.gap {
  display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3);
  border-radius: 8px; font-size: var(--t-13); border: 1px solid var(--rule);
}
.gap[data-state="miss"] { background: var(--c-pill-org); border-color: transparent; color: var(--p-org-800); }
.gap[data-state="ok"] { color: var(--ink-muted); }
.statusbar {
  display: flex; align-items: center; gap: var(--s-4); flex: 0 0 auto;
  height: 34px; padding: 0 var(--s-5); border-top: 1px solid var(--rule);
  background: var(--surface-panel); font-size: var(--t-12); color: var(--ink-muted);
}
kbd {
  font: 600 var(--t-12)/1 var(--font-num); padding: 3px 5px; border-radius: 4px;
  border: 1px solid var(--p-edge-soft); background: var(--surface-paper); color: var(--ink-ui);
}
#toast {
  position: fixed; left: 50%; bottom: var(--s-6); transform: translate(-50%, 12px);
  display: flex; align-items: center; gap: var(--s-2);
  min-height: 40px; padding: var(--s-2) var(--s-4); border-radius: 10px;
  background: var(--p-ink-900); color: var(--p-paper); font-size: var(--t-13); font-weight: 600;
  box-shadow: 0 12px 32px -12px rgba(0,0,0,.5);
  opacity: 0; pointer-events: none;
  transition: opacity var(--d-panel) var(--e-out), transform var(--d-panel) var(--e-out);
  max-width: min(560px, 90vw);
}
[data-theme="dark"] #toast { background: var(--p-ink-900); color: var(--p-paper); }
#toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }
#toast[data-tone="warn"] { background: var(--flag-mark); color: var(--ink-on-solid); }

/* 抽屉（设置） */
.drawer {
  position: fixed; inset: 0 auto 0 0; width: min(420px, 92vw); z-index: 30;
  background: var(--surface-panel); border-right: 1px solid var(--rule);
  transform: translateX(-100%); transition: transform var(--d-panel) var(--e-out);
  display: flex; flex-direction: column; box-shadow: 0 0 60px rgba(0,0,0,.18);
}
.drawer[data-open="true"] { transform: none; }
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(26,29,33,.32); opacity: 0; pointer-events: none; transition: opacity var(--d-panel) var(--e-out); }
.scrim[data-open="true"] { opacity: 1; pointer-events: auto; }
.drawer header { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-4); border-bottom: 1px solid var(--rule); }
.drawer .inner { padding: var(--s-4); overflow-y: auto; }

/* 响应式 */
@media (max-width: 1280px) { :root { --insp-w: 336px; --measure: 34em; } }
@media (max-width: 1040px) {
  .body { flex-direction: column; overflow-y: auto; }
  .rail { flex: 0 0 auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: var(--s-2); }
  .rail .lead, .rail-foot { display: none; }
  .step .sub { display: none; }
  .inspector { flex: 1 1 auto; border-left: 0; border-top: 1px solid var(--rule); }
  .desk-scroll { padding: 0 var(--s-4) var(--s-6); }
  .desk-head { padding: var(--s-4); }
  .sheet { padding: var(--s-4); }
}
@media (max-width: 720px) {
  .bar { flex-wrap: wrap; height: auto; padding: var(--s-2) var(--s-3); }
  .docname { order: 3; flex: 1 1 100%; }
  .step .nm { font-size: var(--t-13); }
  .ms { font-size: var(--t-18); line-height: 1.9; }
  .srow { flex-wrap: wrap; }
  .srow .ops { opacity: 1; width: 100%; justify-content: flex-end; }
  :root { --measure: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  #toast { transform: translate(-50%, 0); }
}

        '<div class="kv"><span>用过</span><b class="num">' + used + '</b></div>' +
        '<div class="kv"><span>压箱底</span><b class="num">' + (VAULT.length - used) + '</b></div>' +
        '<div class="kv"><span>平均表现</span><b class="num">' + (VAULT.reduce(function (a, v) { return a + v.perf; }, 0) / used).toFixed(2) + '</b></div>' +
        '<p class="note" style="margin-top:12px">「真实细节」只有 1 件——这是你最该补的桶，因为它是唯一让片子不像稿子的东西。</p></div>' +
        '<div class="card"><h3>' + ico('warn') + '查重提醒</h3><p class="note">「报价低不是便宜…」与库内一条实词重合 100%。存之前先确认是不是同一条。</p></div>';
    }
    return '<div class="card"><h3>' + ico('check') + '标准</h3><p class="note">三要素与黑名单的改动会立即作用到下一次预清洗，不需要重来一遍。</p></div>';
  }

  /* 可深链：#diff / #vault / #std / #paste / #model，刷新与分享都回到同一步 */
  var ORDER = ['std', 'paste', 'diff', 'model', 'vault'];
  var h = (location.hash || '').replace('#', '');
  if (ORDER.indexOf(h) >= 0) stage = h;
  /* ?theme=dark|light 给截图和「想固定一档」的人用 */
  var th = (location.search.match(/theme=(dark|light)/) || [])[1];
  if (th) document.documentElement.setAttribute('data-theme', th);

  function syncHash() {
    if ((location.hash || '').replace('#', '') !== stage) {
      history.replaceState(null, '', '#' + stage);
    }
  }
  window.addEventListener('hashchange', function () {
    var s = (location.hash || '').replace('#', '');
    if (ORDER.indexOf(s) >= 0 && s !== stage) { stage = s; inspTab = 'judge'; draw(); }
  });

  /* ---------------- 绘制 ---------------- */
  function draw() {
    syncHash();
    document.querySelectorAll('.step[data-stage]').forEach(function (b) {
      b.setAttribute('aria-current', b.dataset.stage === stage ? 'true' : 'false');
    });
    $('deskTitle').textContent = TITLES[stage];
    $('deskBody').innerHTML = render[stage]();
    $('inspBody').innerHTML = inspHtml();
    ['tab-judge', 'tab-risk', 'tab-why'].forEach(function (id) {
      $(id).setAttribute('aria-selected', id === 'tab-' + inspTab ? 'true' : 'false');
    });
    $('inspBody').setAttribute('aria-labelledby', 'tab-' + inspTab);
    syncBar();
  }

  /* ---------------- 交互 ---------------- */
  var ACT = {
    restore: function (el) {
      var i = +el.dataset.i; S[i].st = 'kept';
      draw(); toast('第 ' + (i + 1) + ' 句已放回（句子指纹已记录，改字不错位）');
    },
    drop: function (el) { var i = +el.dataset.i; S[i].st = 'cut'; draw(); toast('已删整句'); },
    keep: function (el) { var i = +el.dataset.i; S[i].st = 'kept'; draw(); toast('留着——它不属于自动删除范围'); },
    flag: function (el) { var i = +el.dataset.i; S[i].st = 'mark'; S[i].why = '人工标记待删'; draw(); toast('已标记【待删】', 'warn'); },
    risk: function (el) {
      /* 词 → 句子下标 → 检视器里那条风险的 id；不拿文字去猜，改文案就失效 */
      inspTab = 'risk'; draw();
      var node = $('risk' + el.dataset.i);
      if (node) { node.setAttribute('tabindex', '-1'); node.focus({ preventScroll: true }); node.scrollIntoView({ block: 'nearest' }); }
      else toast('这条风险不在当前风险面板里');
    },
    'to-diff': function () { stage = 'diff'; inspTab = 'judge'; draw(); toast('预清洗完成：5 句被删，2 句只标记，先逐句核对'); },
    'finish-diff': function () {
      var c = counts();
      if (c.todo) { toast('还有 ' + c.todo + ' 处没核对，Prompt 包会带上未处理的句子', 'warn'); stage = 'diff'; draw(); return; }
      stage = 'model'; inspTab = 'judge'; draw(); toast('清洗稿已冻结，Prompt 包按最新标准生成');
    },
    'to-vault': function () { stage = 'vault'; inspTab = 'judge'; draw(); toast('成片记录已登记，本条用过的 5 件素材用过次数 +1'); },
    bucket: function (el) { bucket = el.dataset.b; draw(); },
    star: function (el) {
      var i = +el.dataset.i, n = +el.dataset.n;
      TAKES[i].star = n; TAKES[i].lines = '本条用了 ' + (n + 1) + ' 件素材';
      VAULT.forEach(function (v) { if (v.used > 0) v.perf = Math.max(1, Math.min(5, +(v.perf * 0.8 + n * 0.2).toFixed(1))); });
      draw(); toast('已打 ' + n + ' 星，均分回流到「客户原话」「带数字的结果」等 ' + TAKES[i].src + ' 桶');
    },
    sample: function () { toast('示例稿已载入（原型里是静态文本，产品里会真的灌进稿纸）'); },
    sample2: function () { bucket = '全部'; stage = 'paste'; inspTab = 'judge'; draw(); toast('已切到第 2 步：粘上示例稿，再回来就能看到素材'); },
    'clear-raw': function () { toast('文稿已清空（标准与素材库保留）'); },
    'vault-add': function () { toast('手记一条素材时会做查重：实词重合 ≥ 50% 才提醒，只共享句式框架的不算重复'); },
    copy: function (el) { toast('已复制' + el.dataset.what); },
    dl: function () { toast('浏览器已拦截本页的下载演示——原型不落地文件'); },
    'open-settings': function () { openDrawer(); },
    'close-settings': function () { closeDrawer(); },
    'del-word': function (el) { toast('「' + el.dataset.w + '」已从黑名单移除'); el.closest('.chip').remove(); },
    'add-word': function () {
      var v = ($('newWord').value || '').trim();
      if (!v) { toast('先写要删的类型', 'warn'); $('newWord').focus(); return; }
      toast('已加入黑名单：' + v); $('newWord').value = '';
    },
    'vault-edit': function () { toast('改桶：把这条挪到「冲突 / 我的动作 / 客户原话…」，用下拉，不靠拖'); },
    'take-load': function () { stage = 'diff'; inspTab = 'judge'; draw(); toast('已载入这篇成片对应的清洗稿'); }
  };

  /* 「清空库存」用内联二次确认，不弹 confirm() */
  function inlineConfirm(el, cb) {
    if (el.getAttribute('data-armed') === 'true') { cb(); el.removeAttribute('data-armed'); el.innerHTML = ico('trash') + '清空库存'; return; }
    el.setAttribute('data-armed', 'true');
    el.innerHTML = ico('warn') + '确认清空？';
    toast('再点一次才真的清空（10 秒内不点就自动取消）', 'warn');
    setTimeout(function () {
      if (el.getAttribute('data-armed') === 'true') { el.removeAttribute('data-armed'); el.innerHTML = ico('trash') + '清空库存'; }
    }, 10000);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (act === 'vault-clear') { inlineConfirm(el, function () { VAULT.length = 0; draw(); toast('库存已清空'); }); return; }
    if (ACT[act]) { ACT[act](el); }
  });

  document.addEventListener('change', function (e) {
    if (e.target.name === 'blm') toast(e.target.value === 'delete' ? '黑名单改成「整句删除」，已核对过的豁免会作废并提示重跑' : '黑名单改成「只标记」，不删任何字', 'warn');
  });

  /* 句行 Enter：焦点在行本身时放回/撤回，不抢空格（空格要留给滚动） */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var row = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('srow') ? document.activeElement : null;
      if (row) {
        var i = +row.dataset.i;
        if (S[i].st === 'cut') ACT.restore(row); else if (S[i].st === 'kept') { S[i].st = 'cut'; draw(); toast('第 ' + (i + 1) + ' 句撤回删除'); }
        var again = document.querySelector('.srow[data-i="' + i + '"]');
        if (again) { again.setAttribute('tabindex', '-1'); again.focus({ preventScroll: true }); }
        e.preventDefault();
      }
    }
    if (e.altKey && '12345'.indexOf(e.key) >= 0) {
      stage = ['std', 'paste', 'diff', 'model', 'vault'][+e.key - 1]; inspTab = 'judge'; draw();
      $('desk').focus({ preventScroll: true });
      e.preventDefault();
    }
    if (e.key === 'Escape' && $('drawer').getAttribute('data-open') === 'true') closeDrawer();
  });

  /* 检视器 tab（中栏的事件走全局 data-act 代理） */
  document.querySelectorAll('.itab').forEach(function (t) {
    t.addEventListener('click', function () { inspTab = t.id.replace('tab-', ''); draw(); });
  });

  /* 抽屉 */
  function openDrawer() {
    lastFocus = document.activeElement;
    $('drawerBody').innerHTML = render.std();
    $('drawer').setAttribute('data-open', 'true');
    $('scrim').setAttribute('data-open', 'true');
    var first = $('drawer').querySelector('button, input');
    if (first) first.focus();
  }
  function closeDrawer() {
    $('drawer').setAttribute('data-open', 'false');
    $('scrim').setAttribute('data-open', 'false');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $('scrim').addEventListener('click', closeDrawer);
  document.querySelectorAll('[data-act="open-settings"]').forEach(function (b) {
    b.addEventListener('click', openDrawer);
  });

  /* 主题：auto → light → dark 循环 */
  var THEMES = [['auto', 'i-auto', '跟随系统'], ['light', 'i-sun', '日稿'], ['dark', 'i-moon', '夜稿']];
  var ti = 0;
  $('btnTheme').addEventListener('click', function () {
    ti = (ti + 1) % THEMES.length;
    document.documentElement.setAttribute('data-theme', THEMES[ti][0]);
    $('btnTheme').querySelector('use').setAttribute('href', '#' + THEMES[ti][1]);
    $('btnTheme').setAttribute('aria-label', '切换主题：当前为' + THEMES[ti][2]);
    toast('主题：' + THEMES[ti][2]);
  });

  /* 让句子行可以纯键盘走到（Tab 进句子 → Enter 放回） */
  var obs = new MutationObserver(function () {
    document.querySelectorAll('.srow').forEach(function (r) { if (!r.hasAttribute('tabindex')) r.setAttribute('tabindex', '0'); });
  });
  obs.observe($('deskBody'), { childList: true, subtree: true });

  draw();
  document.title = '稿纸台 · 原型 · ' + (counts().todo ? counts().todo + ' 处待判' : '已核对');
})();
</script>
</body>
</html>
